# A to Z Shop Management - Application Configuration
# Environment: Development

# ========================================
# Server Configuration
# ========================================
server.port=8080
server.servlet.context-path=/
server.error.include-message=always

# ========================================
# Database Configuration (PostgreSQL)
# ========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/atozshop
spring.datasource.username=atozshop
spring.datasource.password=atozshop123
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ========================================
# JPA / Hibernate Configuration
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ========================================
# Logging
# ========================================
logging.level.root=INFO
logging.level.com.atozshop=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# ========================================
# JWT Configuration
# ========================================
jwt.secret=atozshop-super-secret-key-change-this-in-production-must-be-at-least-256-bits
jwt.expiration=86400000

# ========================================
# File Upload
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========================================
# Jackson (JSON)
# ========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ========================================
# API Documentation (Swagger)
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ========================================
# Application Configuration
# ========================================
app.name=A to Z Shop Management
app.version=0.1.0
app.default-tenant-id=1